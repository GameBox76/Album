
<!DOCTYPE html>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'scale-up': 'scaleUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        'float': 'float 6s ease-in-out infinite',
                        'shimmer': 'shimmer 1.8s infinite linear',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(8px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        scaleUp: {
                            '0%': { opacity: '0', transform: 'scale(0.92)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(192, 38, 211, 0.35);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(192, 38, 211, 0.7);
        }

        /* Glassmorphism Styles */
        .glass-dark {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .light .glass-dark {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            color: #0f172a;
        }

        /* Android Safe Padding for Modern Notch/Gesture Bars */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }

        /* 3D Coverflow Stage & Cards */
        .coverflow-stage {
            perspective: 1200px;
            perspective-origin: 50% 50%;
        }
        .coverflow-card {
            transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.45s ease, filter 0.45s ease, box-shadow 0.45s ease;
            transform-style: preserve-3d;
            will-change: transform, opacity;
        }

        /* Particle Background Canvas */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Shimmer Loading Placeholder */
        .skeleton-loader {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Soft Pulse for slideshow play status */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(217, 70, 239, 0.4); }
            50% { box-shadow: 0 0 28px rgba(217, 70, 239, 0.8); }
        }
        .pulse-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }

        /* Lightbox Image Pan Touch Cursor */
        .touch-grab {
            cursor: grab;
        }
        .touch-grab:active {
            cursor: grabbing;
        }
    </style>
</head>

        ];

        // Global App State Store
        let currentFilter = 'all';

            favorites = JSON.parse(localStorage.getItem('fav_memories_v2') || '[]');
        } catch (e) {
            favorites = [];
        }

        let activeView = 'grid'; // grid, coverflow, flipbook
        let currentLightboxIndex = 0;
        let currentCoverflowIndex = 0;
        let currentFlipPageIndex = 0;
        let slideshowInterval = null;
        let isZoomed = false;

        // Fallback Image handling
        const fallbackImg = 'https://placehold.co/600x800/1e293b/d946ef?text=Memory+Photo';

        // Initialize Application
        window.addEventListener('DOMContentLoaded', () => {
            initParticles();
            renderGrid();
            updateCounts();
            setupTheme();
            setupTouchGestures();
        });

        // Filter photos based on Category and Search Query
        function getFilteredPhotos() {
            return originalImages.filter(item => {
                const matchesCategory = 
                    currentFilter === 'all' ? true :
                    currentFilter === 'favorites' ? favorites.includes(item.id) :
                    item.category === currentFilter;
                
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.trim().toLowerCase());
                return matchesCategory && matchesSearch;
            });
        }

        // Handle Image load error cleanly
        function handleImageError(img) {
            img.onerror = null;
            img.src = fallbackImg;
            const skeleton = img.previousElementSibling;
            if (skeleton && skeleton.classList.contains('skeleton-loader')) {
                skeleton.remove();
            }
        }

        function handleImageLoaded(img) {
            const skeleton = img.previousElementSibling;
            if (skeleton && skeleton.classList.contains('skeleton-loader')) {
                skeleton.classList.add('opacity-0');
                setTimeout(() => skeleton.remove(), 200);
            }
            img.classList.remove('opacity-0');
        }

        // Render Masonry / Adaptive Grid View
        function renderGrid() {
            const container = document.getElementById('grid-container');
            const emptyState = document.getElementById('empty-state');
            const filtered = getFilteredPhotos();

            document.getElementById('visible-count').innerText = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            container.innerHTML = filtered.map((photo, index) => {
                const isFav = favorites.includes(photo.id);
                return `
                    <div class="group relative rounded-2xl overflow-hidden glass-dark border border-slate-800/80 shadow-lg transition-all duration-300 hover:-translate-y-1.5 hover:shadow-2xl hover:shadow-fuchsia-500/15 hover:border-fuchsia-500/40 animate-fade-in" style="animation-delay: ${Math.min(index * 30, 300)}ms;">

                            <!-- Skeleton loader -->
                            <div class="skeleton-loader absolute inset-0 z-0"></div>
                            
                            <img src="${photo.url}" 
                                 alt="${photo.title}" 
                                 loading="lazy"
                                 onload="handleImageLoaded(this)"
                                 onerror="handleImageError(this)"
                                 class="w-full h-full object-cover rounded-2xl opacity-0 transition-opacity duration-300 group-hover:scale-105 transition-transform duration-500">
                            
                            <!-- Favorite overlay button -->
                            <button onclick="event.stopPropagation(); toggleFavorite(${photo.id})" 
                                    class="absolute top-2.5 right-2.5 z-10 w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-slate-950/70 backdrop-blur-md border border-white/10 flex items-center justify-center transition active:scale-90 text-${isFav ? 'pink-500' : 'slate-300'} hover:text-pink-500">
                                <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart text-xs sm:text-sm"></i>
                            </button>

                            <!-- Touch & Hover Overlay -->
                            <div onclick="openLightboxByPhotoId(${photo.id})" class="absolute inset-0 z-0 bg-gradient-to-t from-slate-950 via-slate-950/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-3.5 sm:p-4 cursor-pointer">
                                <span class="text-[9px] font-bold uppercase tracking-widest text-fuchsia-400 mb-0.5">#${photo.id} &bull; ${photo.category}</span>
                                <h3 class="text-white font-serif font-bold text-sm sm:text-base leading-tight truncate">${photo.title}</h3>
                                <div class="flex items-center gap-2 mt-2 text-[11px] text-slate-300 font-medium">
                                    <span class="px-2.5 py-1 rounded-full bg-fuchsia-600/90 text-white backdrop-blur-sm shadow"><i class="fa-solid fa-expand text-[9px] mr-1"></i> Inspect</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render 3D Coverflow View
        function renderCoverflow() {
            const wrapper = document.getElementById('coverflow-wrapper');
            const filtered = getFilteredPhotos();

            if (filtered.length === 0) {
                wrapper.innerHTML = `<p class="text-slate-400 text-xs">No photos match your query.</p>`;
                return;
            }

            if (currentCoverflowIndex >= filtered.length) {
                currentCoverflowIndex = 0;
            }

            wrapper.innerHTML = filtered.map((photo, index) => {
                const offset = index - currentCoverflowIndex;
                const absOffset = Math.abs(offset);
                
                // Adaptive spacing for mobile screen sizes
                const isMobile = window.innerWidth < 640;
                const translateX = offset * (isMobile ? 110 : 180);
                const translateZ = -absOffset * (isMobile ? 120 : 200);
                const rotateY = offset * -32;
                const opacity = absOffset > 3 ? 0 : 1 - absOffset * 0.22;
                const zIndex = 100 - absOffset;

                return `
                    <div class="coverflow-card absolute w-52 sm:w-72 h-72 sm:h-96 rounded-2xl overflow-hidden shadow-2xl border border-slate-700/60 cursor-pointer select-none"
                         style="transform: translateX(${translateX}px) translateZ(${translateZ}px) rotateY(${rotateY}deg); opacity: ${opacity}; z-index: ${zIndex};"
                         onclick="selectCoverflowItem(${index})">
                        <img src="${photo.url}" alt="${photo.title}" onerror="handleImageError(this)" class="w-full h-full object-cover pointer-events-none">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent"></div>
                    </div>
                `;
            }).join('');

            // Update Counter & Details
            const currentPhoto = filtered[currentCoverflowIndex];
            if (currentPhoto) {
                document.getElementById('coverflow-counter').innerText = `Photo ${currentCoverflowIndex + 1} of ${filtered.length}`;
                document.getElementById('coverflow-title').innerText = currentPhoto.title;
                const favBtn = document.getElementById('coverflow-fav-btn');
                const isFav = favorites.includes(currentPhoto.id);
                favBtn.className = `w-10 h-10 rounded-full bg-slate-900 border border-slate-800 transition active:scale-90 flex items-center justify-center ${isFav ? 'text-pink-500 border-pink-500/50' : 'text-slate-400'}`;
            }
        }

        function selectCoverflowItem(index) {
            currentCoverflowIndex = index;
            renderCoverflow();
        }

        function prevCoverflow() {
            const filtered = getFilteredPhotos();
            if (filtered.length === 0) return;
            currentCoverflowIndex = (currentCoverflowIndex - 1 + filtered.length) % filtered.length;
            renderCoverflow();
        }

        function nextCoverflow() {
            const filtered = getFilteredPhotos();
            if (filtered.length === 0) return;
            currentCoverflowIndex = (currentCoverflowIndex + 1) % filtered.length;
            renderCoverflow();
        }

        // Render 3D Flipbook / Storybook View
        function renderFlipbook() {
            const wrapper = document.getElementById('flipbook-wrapper');
            const filtered = getFilteredPhotos();

            if (filtered.length === 0) {
                wrapper.innerHTML = `<p class="text-slate-400 text-xs">No photos available for book view.</p>`;

                    <div class="w-full md:w-1/2 h-56 sm:h-80 rounded-2xl overflow-hidden relative shadow-md bg-slate-950">
                        <img src="${photo.url}" alt="${photo.title}" onerror="handleImageError(this)" class="w-full h-full object-cover">

                                <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart text-sm"></i>
                                <span>${isFav ? 'Favorited' : 'Favorite'}</span>
                            </button>
                            <button onclick="openLightboxByPhotoId(${photo.id})" class="px-4 py-2 rounded-xl bg-fuchsia-600 hover:bg-fuchsia-500 text-white text-xs font-semibold shadow transition active:scale-95">

        function prevFlipPage() {
            const filtered = getFilteredPhotos();
            if (filtered.length === 0) return;
            currentFlipPageIndex = (currentFlipPageIndex - 1 + filtered.length) % filtered.length;
            renderFlipbook();
        }

        function nextFlipPage() {
            const filtered = getFilteredPhotos();
            if (filtered.length === 0) return;
            currentFlipPageIndex = (currentFlipPageIndex + 1) % filtered.length;
            renderFlipbook();
        }

        // Lightbox Modal Functions
        function openLightbox(index) {
            const filtered = getFilteredPhotos();
            if (filtered.length === 0) return;

            currentLightboxIndex = index;
            const modal = document.getElementById('lightbox-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);

            updateLightboxContent();
            renderLightboxThumbnails();
            document.body.style.overflow = 'hidden';
        }

        function openLightboxByPhotoId(photoId) {
            const filtered = getFilteredPhotos();
            const index = filtered.findIndex(p => p.id === photoId);
            if (index !== -1) {
                openLightbox(index);
            }
        }

        function closeLightbox() {
            const modal = document.getElementById('lightbox-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);

            if (slideshowInterval) {
                toggleSlideshowAutoPlay();
            }
        }

        function updateLightboxContent() {
            const filtered = getFilteredPhotos();
            if (filtered.length === 0) return;

            const photo = filtered[currentLightboxIndex];
            const img = document.getElementById('lightbox-img');
            
            img.src = photo.url;
            img.onerror = function() { this.src = fallbackImg; };

            document.getElementById('lightbox-counter').innerText = `Photo ${currentLightboxIndex + 1} of ${filtered.length}`;
            document.getElementById('lightbox-caption').innerText = photo.title;

            const favBtn = document.getElementById('lightbox-fav-btn');
            const isFav = favorites.includes(photo.id);
            favBtn.className = `w-9 h-9 rounded-xl bg-slate-900/90 border border-slate-800 transition active:scale-90 flex items-center justify-center ${isFav ? 'text-pink-500 border-pink-500/50' : 'text-slate-300'}`;

            resetZoom();
        }

        function renderLightboxThumbnails() {
            const container = document.getElementById('lightbox-thumbnails');
            const filtered = getFilteredPhotos();

            container.innerHTML = filtered.map((photo, i) => `
                <button onclick="selectLightboxIndex(${i})" class="w-10 h-10 sm:w-12 sm:h-12 rounded-lg overflow-hidden border-2 transition shrink-0 ${i === currentLightboxIndex ? 'border-fuchsia-500 scale-105 shadow-lg ring-2 ring-fuchsia-500/40' : 'border-slate-800 opacity-50 hover:opacity-100'}">
                    <img src="${photo.url}" onerror="handleImageError(this)" class="w-full h-full object-cover">
                </button>
            `).join('');

            // Scroll active thumbnail into view
            const activeThumb = container.children[currentLightboxIndex];
            if (activeThumb) {
                activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }

        function selectLightboxIndex(index) {
            currentLightboxIndex = index;
            updateLightboxContent();
            renderLightboxThumbnails();
        }

        function prevLightboxImage() {
            const filtered = getFilteredPhotos();
            if (filtered.length === 0) return;
            currentLightboxIndex = (currentLightboxIndex - 1 + filtered.length) % filtered.length;
            updateLightboxContent();
            renderLightboxThumbnails();
        }

        function nextLightboxImage() {
            const filtered = getFilteredPhotos();
            if (filtered.length === 0) return;
            currentLightboxIndex = (currentLightboxIndex + 1) % filtered.length;
            updateLightboxContent();
            renderLightboxThumbnails();
        }

        // Zoom Controls
        function toggleZoom() {
            isZoomed = !isZoomed;
            const img = document.getElementById('lightbox-img');
            const zoomBtn = document.getElementById('lightbox-zoom-btn');
            
            if (isZoomed) {
                img.style.transform = 'scale(1.75)';
                img.style.cursor = 'zoom-out';
                zoomBtn.classList.add('text-fuchsia-400', 'border-fuchsia-500');
            } else {
                resetZoom();
            }
        }

        function resetZoom() {
            isZoomed = false;
            const img = document.getElementById('lightbox-img');
            const zoomBtn = document.getElementById('lightbox-zoom-btn');
            img.style.transform = 'scale(1)';
            img.style.cursor = 'pointer';
            zoomBtn.classList.remove('text-fuchsia-400', 'border-fuchsia-500');
        }

        // Slideshow Auto Play
        function toggleSlideshowAutoPlay() {
            const playBtn = document.getElementById('lightbox-play-btn');
            if (slideshowInterval) {
                clearInterval(slideshowInterval);
                slideshowInterval = null;
                playBtn.classList.remove('pulse-glow', 'text-fuchsia-400', 'border-fuchsia-500');
                playBtn.classList.add('text-slate-300');
            } else {
                slideshowInterval = setInterval(() => {
                    nextLightboxImage();
                }, 3000);
                playBtn.classList.add('pulse-glow', 'text-fuchsia-400', 'border-fuchsia-500');
            }
        }

        function openSlideshow() {
            openLightbox(0);
            if (!slideshowInterval) {
                toggleSlideshowAutoPlay();
            }
        }

        // Favorites System
        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            try {
                localStorage.setItem('fav_memories_v2', JSON.stringify(favorites));
            } catch (e) {}
            
            updateCounts();
            refreshCurrentView();
        }

        function toggleFavoriteFromCoverflow() {
            const filtered = getFilteredPhotos();
            const photo = filtered[currentCoverflowIndex];
            if (photo) {
                toggleFavorite(photo.id);
            }
        }

        function toggleFavoriteFromLightbox() {
            const filtered = getFilteredPhotos();
            const photo = filtered[currentLightboxIndex];
            if (photo) {
                toggleFavorite(photo.id);
                updateLightboxContent();
            }
        }

        function updateCounts() {
            document.getElementById('count-all').innerText = originalImages.length;
            document.getElementById('count-favs').innerText = favorites.length;

        // View Switching Engine
        function switchView(viewName) {
            activeView = viewName;
            
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(`view-${viewName}`).classList.remove('hidden');

            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.className = 'view-btn px-2.5 sm:px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center gap-1.5';
            });
            const activeBtn = document.getElementById(`view-${viewName}-btn`);
            activeBtn.className = 'view-btn px-2.5 sm:px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 bg-fuchsia-600 text-white shadow-md';

            refreshCurrentView();
        }

        function refreshCurrentView() {
            if (activeView === 'grid') renderGrid();
            if (activeView === 'coverflow') renderCoverflow();
            if (activeView === 'flipbook') renderFlipbook();
        }

        // Filtering & Search handlers
        function setFilter(category) {
            currentFilter = category;
            
            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.className = 'filter-chip px-3.5 py-1.5 rounded-full text-xs font-semibold border border-slate-800 bg-slate-900/80 text-slate-300 hover:border-fuchsia-500/50 transition shrink-0';
            });
            event.currentTarget.className = 'filter-chip px-3.5 py-1.5 rounded-full text-xs font-semibold border transition active-chip bg-fuchsia-600 border-fuchsia-500 text-white shrink-0';

            refreshCurrentView();
        }

        function handleSearch() {
            const val = document.getElementById('search-input').value;
            searchQuery = val;
            const clearBtn = document.getElementById('search-clear-btn');
            if (val.trim().length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            refreshCurrentView();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            document.getElementById('search-clear-btn').classList.add('hidden');
            searchQuery = '';
            refreshCurrentView();
        }

        function resetFilters() {
            clearSearch();
            currentFilter = 'all';
            refreshCurrentView();
        }

        // Light / Dark Theme toggle
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('theme-toggle');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                btn.innerHTML = `<i class="fa-solid fa-sun text-xs sm:text-sm text-amber-400"></i>`;
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                btn.innerHTML = `<i class="fa-solid fa-moon text-xs sm:text-sm"></i>`;
            }
        }

        function setupTheme() {
            document.documentElement.classList.add('dark');
        }

        // Touch Gestures & Swipe Handling for Android & Mobile
        function setupTouchGestures() {
            let touchStartX = 0;
            let touchStartY = 0;

            // Keyboard navigation
            window.addEventListener('keydown', (e) => {
                const lightboxHidden = document.getElementById('lightbox-modal').classList.contains('hidden');
                
                if (!lightboxHidden) {
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') prevLightboxImage();
                    if (e.key === 'ArrowRight') nextLightboxImage();
                    if (e.key === ' ') { e.preventDefault(); toggleSlideshowAutoPlay(); }
                } else if (activeView === 'coverflow') {
                    if (e.key === 'ArrowLeft') prevCoverflow();
                    if (e.key === 'ArrowRight') nextCoverflow();
                } else if (activeView === 'flipbook') {
                    if (e.key === 'ArrowLeft') prevFlipPage();
                    if (e.key === 'ArrowRight') nextFlipPage();
                }
            });

            // Swipe gestures for Lightbox
            const lightboxStage = document.getElementById('lightbox-stage');
            lightboxStage.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            lightboxStage.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                const diffX = touchEndX - touchStartX;
                const diffY = touchEndY - touchStartY;

                // Horizontal swipe (if not heavily vertical)
                if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX < 0) nextLightboxImage();
                    else prevLightboxImage();
                } 
                // Swipe down to close lightbox on Android
                else if (diffY > 80 && Math.abs(diffY) > Math.abs(diffX)) {
                    closeLightbox();
                }
            }, { passive: true });

            // Swipe gestures for Coverflow
            const coverflowArea = document.getElementById('coverflow-touch-area');
            coverflowArea.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            coverflowArea.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].screenX;
                const diffX = touchEndX - touchStartX;
                if (Math.abs(diffX) > 35) {
                    if (diffX < 0) nextCoverflow();
                    else prevCoverflow();
                }
            }, { passive: true });

            // Swipe gestures for Flipbook
            const flipbookArea = document.getElementById('flipbook-touch-area');
            flipbookArea.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            flipbookArea.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].screenX;
                const diffX = touchEndX - touchStartX;
                if (Math.abs(diffX) > 35) {
                    if (diffX < 0) nextFlipPage();
                    else prevFlipPage();
                }
            }, { passive: true });
        }

        // Ambient Floating Particle Background
        function initParticles() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];

            function resize() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                ctx.scale(dpr, dpr);
            }
            resize();
            window.addEventListener('resize', resize);

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * window.innerWidth;
                    this.y = Math.random() * window.innerHeight;
                    this.size = Math.random() * 2 + 0.5;
                    this.speedY = -(Math.random() * 0.35 + 0.1);
                    this.opacity = Math.random() * 0.45 + 0.1;
                }
                update() {
                    this.y += this.speedY;
                    if (this.y < 0) {
                        this.y = window.innerHeight;
                        this.x = Math.random() * window.innerWidth;
                    }
                }
                draw() {
                    ctx.fillStyle = `rgba(217, 70, 239, ${this.opacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const count = window.innerWidth < 640 ? 20 : 40;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }

            function animate() {
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
